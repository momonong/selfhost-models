# Explicit override, selected by modelctl from the persisted BACKEND setting.
services:
  worker:
    image: selfhost-models-transformers:0.1.0
    stop_grace_period: 30s
    build:
      dockerfile: docker/transformers.Dockerfile
    command: [python, -m, uvicorn, "worker.transformers_app:app", --host, "0.0.0.0", --port, "8000", --workers, "1", --no-access-log, --timeout-graceful-shutdown, "5"]
    environment:
      MODEL_ID: ${MODEL_ID:?Use modelctl serve}
      MODEL_REVISION: ${MODEL_REVISION:?Use modelctl serve}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-2048}
      MAX_INFLIGHT: "1"
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.60}
    read_only: true
    # Native PyTorch/Triton kernels compile and load shared objects here.
    tmpfs: [/tmp, "/runtime-cache:rw,exec,nosuid,nodev,size=1g,mode=1777"]
    cap_drop: [ALL]
