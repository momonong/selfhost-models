[project]
name = "selfhost-transformers-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["transformers==5.16.1", "uvicorn==0.35.0", "pydantic==2.11.7", "Pillow==11.3.0"]

[tool.uv]
required-version = ">=0.11.21,<0.13"
package = false
# CUDA/PyTorch/torchvision are supplied unchanged by the digest-pinned official
# runtime. The isolated uv venv inherits them; they are not separately resolved.
